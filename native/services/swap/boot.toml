# services/swap/boot.toml — this service's boot-manifest row (the design
# lives in res/boot.toml's header).  The row rides beside the crate it
# endows, redox-style; whether and WHEN it founds is the root manifest's
# `services` list — founding order and chain adjacency are topology, the
# root's to declare, never a row's.

[service]
image     = "kore-svc-swap"
endowment = "kore_svc_swap::ZramEndowment"
protocol  = "kore_svc_swap::ZramSwap"
endows    = ["MEM_SUPPLY@0"]
digest_x86_64  = "blake3:c64857d1f04b3d2fcf5fcb547fc4a64eddd367df7e326341adb64e7798488dce"  # res/x86_64/; make boot-digests
digest_aarch64 = "blake3:bfdbd6b573e15ad82edb567ef3cfab5112e298fbdccd284418b9c29809bdf4de"  # res/aarch64/; make boot-digests-aarch64
