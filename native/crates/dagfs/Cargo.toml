[package]
name = "kore-dagfs"
version = "0.1.0"
edition = "2024"
publish = false
description = "The DagFS process-side contract: names, identities, capacity bounds, the request/reply protocol, its codec, and the typed clients — held by any application without linking the storage engine, providers, or device stack"

[features]
default = []
# The half that needs the runtime: the request/reply protocol (peer and slot
# vocabulary), the search query types (the extraction contract's bounds),
# the wire codec, the ring and host clients, and the view capability leaves.
# Pure types — names, ids, bounds, errors, paths — never need it, which is
# what lets the linker stub and a no-allocator image hold a `Name`.
runtime = ["dep:kore-rt", "dep:kore-svc-extract", "dep:zerocopy"]
# Plain-text index publication for the version a client just wrote (the
# #476 producer seam): the walker's `index` module and its parser.
index = ["runtime", "dep:kore-svc-extract-worker-rust"]

[dependencies]
heapless = { version = "0.9.3", default-features = false }
kore-abi = { path = "../abi" }
kore-collections = { path = "../collections", default-features = false }
kore-rt = { path = "../rt", default-features = false, optional = true }
kore-svc-extract = { path = "../../services/extract", optional = true }
kore-svc-extract-worker-rust = { path = "../../services/extract-worker-rust", optional = true }
# The little-endian field wrappers the frozen records are built from.  No
# derive feature: this crate defines no wire layout of its own, it only reads
# and writes kore-abi's.
zerocopy = { version = "0.8", default-features = false, optional = true }

[dev-dependencies]
# The codec suite reads records from adversary-shaped bytes, which needs the
# `FromBytes`/`IntoBytes` faces the library itself has no reason to name.
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
kore-rt = { path = "../rt", features = ["std"] }
kore-svc-extract = { path = "../../services/extract" }
