# Host adapter between axiom and the virtio-accel accelerator contract.
#
# Two directions across one seam:
#   provider — `AxTosaAccelerator` implements `virtio_accel_core::Accelerator`
#              over the axtosa executor, making axiom's CPU kernels a
#              first-class virtio-accel backend;
#   consumer — `Session<P>`/`Hetero<C, A>` drive *any* provider (Core ML /
#              OpenVINO / Hexagon / mock / axtosa) through the same contract,
#              routing per artifact capability and problem size.

[package]
name = "axnn-vaccel"
version = "0.1.0"
edition = "2024"

[dependencies]
ax-exec = { path = "../ax-exec" }
ax = { path = "../ax", features = ["kernel-lowering"] }
axnn = { path = "../axnn", default-features = false }
axnn-cpu = { path = "../axnn-cpu", default-features = false }
axtosa = { path = "../axtosa" }
virtio-accel-core = "0.4.0"
virtio-accel-tosa = { version = "0.4.0", default-features = false }
virtio-accel-tosa-build = "0.4.0"
virtio-accel-coreml = { version = "0.4.0", optional = true }
virtio-accel-openvino = { version = "0.4.0", optional = true }
virtio-accel-xdna = { version = "0.4.0", optional = true }
virtio-accel-vulkan = { version = "0.4.0", optional = true }
minifb = { version = "0.28", optional = true }
# Hash binding for captured compiled blobs; kore's `ArtifactBuild` records
# use BLAKE3 as well.
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[dev-dependencies]
axgeom = { path = "../axgeom", features = ["graph"] }
axshader = { path = "../axshader" }

[build-dependencies]
pkg-config = "0.3"
cc = { version = "1", optional = true }

[features]
default = []
# Optional native field compute on macOS 15+; ordinary builds do not compile
# or link the Objective-C++ bridge or Apple frameworks.
metal = ["dep:cc"]
# Core ML / Neural Engine provider (macOS 14+ hosts).
coreml = ["dep:virtio-accel-coreml"]
# OpenVINO NPU/GPU/CPU provider (hosts with an OpenVINO 2026.x runtime).
openvino = ["dep:virtio-accel-openvino"]
# AMD XDNA2 provider through the amdxdna-native HRX runtime. The feature
# remains compile-portable when HRX is absent; requesting XDNA at runtime then
# fails explicitly instead of falling back to the CPU under an accelerator label.
xdna = ["dep:virtio-accel-xdna"]
# Vendor-neutral Vulkan 1.3 compute provider (virtio-accel-vulkan 0.4.0): the
# FP32 and FP16 TOSA operator tiers on any conformant device, including
# lavapipe/llvmpipe. The loader is bound at run time, so the feature is
# compile-portable; a missing loader or device is a runtime `InitError`.
vulkan = ["dep:virtio-accel-vulkan"]
# Windowed visual examples.
window = ["dep:minifb"]

[[example]]
name = "duet"
required-features = ["window"]

[[example]]
name = "interstellar"
required-features = ["window"]

[[example]]
name = "kerr"

[[example]]
name = "fp8_expand"
required-features = ["openvino"]

[[example]]
name = "capture_blobs"
required-features = ["openvino"]
