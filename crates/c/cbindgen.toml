language = "C"
include_guard = "KORE_PROGRAM_H"
pragma_once = true
cpp_compat = true
usize_is_size_t = true
style = "both"
no_includes = true
includes = ["../kore.h"]
autogen_warning = "/* Generated by cbindgen 0.29.4 from kore-c. Do not edit. */"
header = "/* libkore.so: what an independent C program on Kore adds to kore.h. Link with -lkore. */"
[parse]
parse_deps = false
[export]
# The C library's half of the program lifecycle (its start and exit call
# these), not an application API: the C library declares them itself, as
# its <stdlib.h> declares `abort`. `KoreFsStep` is kore.h's typedef, which
# this header includes.
# `open`, `close`, `read`, `write`, `poll`, `mmap` and `munmap` are POSIX's,
# declared by <fcntl.h>, <unistd.h>, <poll.h> and <sys/mman.h>; so is
# `struct pollfd`.
exclude = ["__kore_program_start", "__kore_program_exit", "__kore_program_arguments", "abort", "open", "close", "read", "write", "poll", "PollFd", "mmap", "munmap", "KoreFsStep"]
# No function takes the register block: a program maps it.
include = ["KoreVdevRegisters"]
[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
