[package]
name = "kore-ffi"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
[dependencies]
kore = { package = "kore-std", path = "../.." }

[features]
# Export standard C allocation and thread lifecycle symbols on Kore targets only.
c-stdlib = []
# Host-only executable C/Zig ABI tests; no target runtime dependency.
test-foreign = []
[build-dependencies]
cc = "1"

[dev-dependencies]
kore = { package = "kore-std", path = "../..", features = ["heap"] }
