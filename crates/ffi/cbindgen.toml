language = "C"
include_guard = "KORE_H"
pragma_once = true
cpp_compat = true
usize_is_size_t = true
style = "both"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
autogen_warning = "/* Generated by cbindgen 0.29.4 from kore-ffi. Do not edit. */"
header = "/* Kore alpha ABI v1. Capability-owned APIs; scoped worker calls join synchronously. */"
[parse]
parse_deps = false
[export]
# Optional bare C symbols use the same declarations via kore/stdlib.h aliases.
exclude = ["malloc", "calloc", "realloc", "free", "pthread_create", "pthread_join", "pthread_detach", "pthread_cancel", "pthread_key_create", "pthread_key_delete", "pthread_setspecific", "pthread_getspecific", "pthread_setcancelstate", "pthread_setcanceltype", "pthread_testcancel", "pthread_exit", "__cxa_thread_atexit", "__cxa_thread_atexit_impl"]
include = ["KoreHashEqual", "KoreHashVisit", "KoreFsStep", "KoreFsCompletion", "KoreFsError", "KoreTaskStep", "KoreTaskAction", "KoreSpmdStep", "KoreThreadStep", "KoreThreadStart"]
[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"
