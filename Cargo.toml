[package]
name = "kore-std"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
description = "Kore application standard library over native capability owners"
repository = "https://github.com/MicroPerceptron/libkore"

[workspace]
resolver = "3"
members = ["tests/consumer", "crates/ffi", "crates/entry", "crates/wasi"]
exclude = ["native"]

[features]
default = ["fs"]
fs = ["dep:kore-dagfs", "kore-dagfs/runtime"]
heap = ["kore-rt/heap"]
crt0 = ["kore-rt/crt0"]
driver = ["dep:kore-driver", "kore-driver/service"]

# Byte-exact native export; source revision and hashes live in native/provenance.json.
[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["nightly", "default-hasher"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["rng", "zeroize"] }
zeroize = { version = "1.8.1", default-features = false }
kore-abi = { path = "native/crates/abi" }
kore-app = { path = "native/crates/app" }
kore-rt = { path = "native/crates/rt", default-features = false }
kore-dagfs = { path = "native/crates/dagfs", optional = true }
kore-driver = { path = "native/crates/driver", optional = true }

[package.metadata.kore]
# Used by tools/local-kore.py to construct one coherent local source override.
owner-paths = { kore-start = "crates/start", kore-abi = "crates/abi", kore-app = "crates/app", kore-rt = "crates/rt", kore-dagfs = "crates/dagfs", kore-driver = "crates/driver" }
