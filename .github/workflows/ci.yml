name: Alpha CI
on:
  pull_request:
    branches: [alpha, main, 'ft/**', 'codex/libkore-network']
  push:
    branches: [alpha, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: alpha-host-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fetch --locked
      - name: Install pinned binding tools
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          python3 tools/install-zig.py "$RUNNER_TEMP/libkore-tools" > "$RUNNER_TEMP/zig-path"
          echo "ZIG=$(cat "$RUNNER_TEMP/zig-path")" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/libkore-zig-cache" >> "$GITHUB_ENV"
      - run: make fmt test check docs owners bindings-check
      # Negative control plus a patched Git consumer, using the exported tree
      # as the local native owner. No cross-repository credential is needed.
      - name: Native type composition
        run: python3 tools/check-local.py native

  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64gc]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: alpha-${{ matrix.arch }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo check --locked -p kore-std -p kore-ffi -p kore-entry --all-features --target targets/${{ matrix.arch }}-unknown-kore-user.json -Z build-std=core,alloc,compiler_builtins -Z build-std-features=compiler-builtins-mem
      - name: Link returning Rust programs and reject integer return types
        run: python3 tools/check-entry.py --arch ${{ matrix.arch }}
      - name: Verify freestanding C allocation symbols
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y llvm
          python3 tools/check-alloc-symbols.py --arch ${{ matrix.arch }}
      - name: Link libkore.so and check its exported ABI
        run: python3 tools/check-program.py --arch ${{ matrix.arch }}
      - name: Build the TLS-enabled x86_64 runtime
        if: matrix.arch == 'x86_64'
        run: make tls-guest
      - name: Upload the TLS runtime and C sources
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: libkore-tls-x86_64
          path: target/tls/guest-x86_64/
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: make miri
